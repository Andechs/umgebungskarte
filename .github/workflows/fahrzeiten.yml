name: Fahrzeiten berechnen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  berechnen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fahrzeiten.mjs
      - name: Ergebnis einchecken
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/fahrzeiten.json
          git commit -m "Fahrzeiten neu berechnet" || echo "Keine Änderung"
          git push
